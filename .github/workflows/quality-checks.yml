name: Quality checks

on:
  push:
    branches: [ui/edith-interface]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libpulse0 fonts-noto-core
      - name: Install UI and remote network test dependencies
        run: python -m pip install pillow requests psutil PyQt6 fastapi httpx python-multipart cryptography
      - name: Compile all Python modules
        run: python -m compileall -q main.py ui.py setup.py actions core agents dashboard memory plugins tests config tools
      - name: Run product contract and headless Qt UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Check inline dashboard JavaScript
        run: python tests/check_inline_js.py
      - name: Test remote phone reconnect and command safety in Node
        run: node tests/check_phase5_js.js


      - name: Test remote workspace pairing interactions
        run: node tests/check_workspace_js.js
