name: Local Rust sandbox

on:
  pull_request:
    branches: [main]
    paths:
      - "sandbox-rs/**"
      - "core/sandbox_runner.py"
      - "actions/dev_agent.py"
      - "actions/code_helper.py"
      - "actions/desktop.py"
      - ".github/workflows/rust-sandbox.yml"
  push:
    branches: [main, backend/versioned-agents-foundation]
    paths:
      - "sandbox-rs/**"
      - ".github/workflows/rust-sandbox.yml"

permissions:
  contents: read

jobs:
  rust-sandbox:
    name: Rust sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile sandbox helper
        run: cargo check --manifest-path sandbox-rs/Cargo.toml
      - name: Build release helper
        run: cargo build --release --manifest-path sandbox-rs/Cargo.toml
      - name: Run native sandbox unit tests
        run: cargo test --manifest-path sandbox-rs/Cargo.toml
      - name: Smoke-test Windows AppContainer execution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "edith-appcontainer-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $marker = Join-Path $workspace ".edith-sandbox-smoke-ok"
          $helper = Join-Path $PWD "sandbox-rs/target/release/edith-sandbox.exe"
          $cmd = Join-Path $env:WINDIR "System32/cmd.exe"
          try {
            & $helper run --workspace $workspace --timeout 20 --memory-mb 256 --cpu-seconds 15 --network deny -- $cmd /d /c "echo EDITH_SANDBOX_CI_OK>.edith-sandbox-smoke-ok"
            if ($LASTEXITCODE -ne 0) { throw "AppContainer exited with code $LASTEXITCODE" }
            if (-not (Test-Path -LiteralPath $marker)) { throw "Sandbox child did not create its workspace marker." }
            if ((Get-Content -Raw -LiteralPath $marker).Trim() -ne "EDITH_SANDBOX_CI_OK") { throw "Unexpected workspace marker content." }
            Write-Host "PASS: Windows AppContainer wrote inside its isolated workspace."
          }
          finally {
            Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Check native binary version (Unix)
        if: runner.os != 'Windows'
        run: ./sandbox-rs/target/release/edith-sandbox --version
      - name: Check native binary version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./sandbox-rs/target/release/edith-sandbox.exe --version
